<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#30d158"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- 電波 -->
  <g fill="none" stroke="url(#wave)" stroke-width="14" stroke-linecap="round">
    <path d="M 180 280 Q 256 220 332 280"/>
    <path d="M 150 310 Q 256 200 362 310" opacity="0.7"/>
    <path d="M 120 340 Q 256 180 392 340" opacity="0.5"/>
  </g>
  <!-- アンテナ本体 -->
  <g fill="#fff" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="280" x2="256" y2="420"/>
    <line x1="220" y1="300" x2="292" y2="300"/>
    <line x1="210" y1="330" x2="302" y2="330"/>
    <line x1="200" y1="360" x2="312" y2="360"/>
    <line x1="190" y1="390" x2="322" y2="390"/>
  </g>
  <!-- 送信ポイント -->
  <circle cx="256" cy="280" r="10" fill="#ff3b30"/>
</svg>
